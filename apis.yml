aid: blue-vision-labs
name: Blue Vision Labs
description: 'Blue Vision Labs was a London-based computer-vision company that built the first city-scale
  augmented reality cloud — crowdsourcing centimetre-accurate 3D maps of entire cities from images captured
  by car-mounted smartphone cameras, then letting developers use visual positioning to place shared and
  persistent AR content that every device sees in the same real-world spot. It emerged from stealth in
  March 2018 with a $14.5M round led by GV, alongside Accel and Horizons Ventures, and offered invite-only
  early access to iOS and Android SDKs covering San Francisco, New York City and London. Lyft acquired the
  company in October 2018 and made it the UK hub of its Level 5 self-driving division. The developer
  platform is retired: bluevisionlabs.com no longer resolves to a web host, the documentation and SDK
  downloads are offline, and no public API surface remains.'
